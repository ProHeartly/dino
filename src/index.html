<body>
    <h1>Hello worlddddd</h1>
    <canvas width="854" height="480" id="canvas"></canvas>
    <style>
        body {
            background-color: #30343f;
            color: #e4d9ff;
            font-family: monospace;
            text-align: center; 
        }
        canvas {
            background-color: #fafaff;
        }
    </style>
    <script>
        // turns out its way over 3,072 bytes, so i will have to cut everything uppppp
        // started with sprites which ate up most of the spaces!
        // replaced old line making strat with just making rectangle which is 1 liner
        // using precalculated values for things that are constant like x, y, width, height, etc of vari, dino's y pos, position of text, other
        // I changed names to short for extra space
        document.querySelector("h1").onclick = () => (alert("woaa!"));
        
        const c = document.getElementById("canvas");
        const ctx = c.getContext('2d');

        const dinoS = [1008, 2040, 1784, 2040, 2016, 2044, 8176, 16382, 65520, 65520, 65472, 16320, 3968, 3456, 2304, 3456];

        const Single = [126, 60, 153, 219, 255, 255, 126, 60, 60, 60, 60, 60];
        const Double = [114736, 114736, 246259, 258559, 258559, 127228, 114736, 114736, 114736, 114736, 114736, 114736];
        const Tall = [252, 252, 252, 252, 888, 827, 955, 1023, 1023, 255, 120, 120, 120, 120, 120, 120, 120, 120];

        const vari = [
            { s: Single, cols: 8, w: 56, h: 84, y: 346 },
            { s: Double, cols: 18, w: 126, h: 84, y: 346 },
            { s: Tall, cols: 10, w: 70, h: 126, y: 304 }
        ];


        const pixel = 7; // scales our pixel art

        const groundY = 430; //we define where the ground is, like in our case, its 854x480 (480p quality) and here we can see height is 480 so considering some margin, we can take 430 as safe spot for floor

        let dino = {
            x: 300,
            y: 318, // 430 - 112
            width: 112, // 16 * pixel (7)
            height: 112,
            velocityY: 0,
            gravity: 0.8,
            jumpStrength: 17, // turns out 16 was a little less
            isGrounded: false // to make it only jump when in floorrr
        };

        let obstacles = [];
        let gameSpeed = 10;
        let spawnTimer = 0;
        let nextSpawnTime = 100;
        let gameOver = false;

        let score = 0;

        function spawnObstacle() {
            const ch = vari[Math.floor(Math.random() * 3)];

            obstacles.push({
                x: c.width,
                y: ch.y,
                width: ch.w,
                height: ch.h,
                sprite: ch.s,
                cols: ch.cols
            });
        }

        function drawSprite(s, width, x, y, color) { //draws the dinooo and obstacles
            ctx.fillStyle = color;
            s.forEach((rowNumber, r) => {
            for (let c = 0; c < width; c++) {
                if ((rowNumber >> (width - 1 - c)) & 1) {
                    ctx.fillRect(x + c * pixel, y + r * pixel, pixel, pixel);
                }
            }
        });
        }

        // checks AABB collision
        function checkCol(r1, r2) {
            return (
               r1.x < r2.x + r2.width &&
               r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.height &&
               r1.y + r1.height > r2.y
        )
        }

        function resetGame() {
            obstacles = [];
            spawnTimer = 0;
            gameOver = false;
            dino.y = 318;
            dino.velocityY = 0;
            score = 0;
            update();
        }

        function triggerJump() {
            if (gameOver) {
                resetGame();
                return;
            }
            if (dino.isGrounded) {
                dino.velocityY = -dino.jumpStrength; // (-)ve cuz velocityY's direction is down ;)
                dino.isGrounded = false;
            }
        }

        function update() { //actively updates pos
            ctx.clearRect(0, 0, c.width, c.height);

            score+= 0.15;
            dino.velocityY += dino.gravity;
            dino.y += dino.velocityY;

            dino.isGrounded = dino.y >= 318;
            if (dino.isGrounded) {
                dino.y = 318;
                dino.velocityY = 0;
            }

            // spawner
            spawnTimer++;
            if (spawnTimer >= nextSpawnTime) {
                spawnObstacle();
                spawnTimer = 0;
                nextSpawnTime = Math.floor(Math.random()*80) + 80;
            }

            // move andd draw obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                drawSprite(obstacles[i].sprite, obstacles[i].cols, obstacles[i].x, obstacles[i].y, "#283618"); //this new green little better

                if (checkCol(dino, obstacles[i])) {
                    gameOver = true;
                    
                    ctx.clearRect(0, 0, c.width, c.height);
                    ctx.fillStyle = '#1e2749';
                    ctx.font = 'bold 36px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER!', 427, 200);
                    ctx.fillText(`Your score: ${Math.floor(score)}`, 427, 240);
                    ctx.fillText('Press SPACE or CLICK to Restart', 427, 280);
                    return;
                }
                if (obstacles[i].x + obstacles[i].width < 0) obstacles.splice(i, 1);
            }
            

            ctx.fillStyle = '#1e2749';
            ctx.fillRect(0, groundY, c.width, 3); // why didn't i think of this earlierr, we can just make it rectangle and save space

            drawSprite(dinoS, 16, dino.x, dino.y, "#273469");
            
            requestAnimationFrame(update);
        }

        window.addEventListener('mousedown', triggerJump);
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                triggerJump();
            }
        });

        update();
    </script>
</body>
